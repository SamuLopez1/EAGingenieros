# Servidor de la web: entrega la SPA y hace de proxy hacia la API.
#
# Decisión importante sobre el proxy: `proxy_pass` va SIN ruta final, así que
# nginx reenvía el URI original sin modificarlo. El prefijo `/api/v1` es el
# real de FastAPI, de modo que `/api/v1/opportunities` llega intacto.
#
# Antes existía un `rewrite` que eliminaba `/api`, con el resultado de que el
# listado de oportunidades pedía `/v1/opportunities` — una ruta que la API no
# sirve. El smoke test no lo detectaba porque solo comprobaba `/api/health`.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El contenido de un pliego es contenido no confiable: nunca debe poder
    # ejecutarse en el contexto del navegador ni enmarcarse desde otro sitio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La ingesta y el análisis pueden tardar: el OCR de un pliego de
        # decenas de páginas supera con holgura el timeout por defecto de 60s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Los archivos suben por aquí. El límite de la aplicación es menor;
        # este es el techo del transporte, no la política de admisión.
        client_max_body_size 64m;
    }

    # --- Activos con hash en el nombre -------------------------------------
    # Vite les pone un hash de contenido, así que un cambio produce otro
    # nombre. Se pueden cachear indefinidamente sin riesgo de servir una
    # versión obsoleta.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA ---------------------------------------------------------------
    # Cualquier ruta desconocida devuelve index.html para que el enrutador del
    # cliente resuelva. Sin esto, recargar una ruta como /oportunidades/123
    # daría 404 en el servidor.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index nunca se cachea: es el que referencia los activos con hash, y
    # una copia vieja impediría ver un despliegue nuevo.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
