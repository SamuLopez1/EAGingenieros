name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Dependencias del sistema para la extracción de documentos. Sin poppler,
      # pdf2image no puede rasterizar y las pruebas de OCR fallan; sin el
      # paquete de español, el OCR devolvería texto inservible sin dar error.
      # Se instalan aquí para que CI pruebe el mismo entorno que producción.
      - name: Instalar dependencias de OCR
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            tesseract-ocr tesseract-ocr-spa poppler-utils
          tesseract --list-langs
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m ruff check .
      - run: python -m mypy app
      - run: python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
